---
- name: Check database settings
  ansible.builtin.assert:
    that:
      - db_name | length > 0
      - db_user | length > 0
      - db_password | length > 0
    fail_msg: Set POSTGRES_DB, POSTGRES_USER and POSTGRES_PASSWORD on the control node
  no_log: true

- name: Wait for PostgreSQL TCP port
  ansible.builtin.wait_for:
    host: "{{ db_host }}"
    port: "{{ db_port }}"
    timeout: 60

- name: Create application group
  ansible.builtin.group:
    name: "{{ app_user }}"
    system: true

- name: Create application user
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_user }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: root
    group: "{{ app_user }}"
    mode: '0750'

- name: Upload and unpack application
  ansible.builtin.unarchive:
    src: "{{ app_archive }}"
    dest: "{{ app_dir }}"
    owner: root
    group: root
    mode: '0755'
  notify: Restart application

- name: Configure application environment
  ansible.builtin.template:
    src: app.env.j2
    dest: "{{ app_dir }}/app.env"
    owner: root
    group: "{{ app_user }}"
    mode: '0640'
  no_log: true
  notify: Restart application

- name: Install application launch script
  ansible.builtin.template:
    src: start.sh.j2
    dest: "{{ app_dir }}/start.sh"
    owner: root
    group: "{{ app_user }}"
    mode: '0750'
    validate: /bin/sh -n %s
  notify: Restart application

- name: Configure application process
  ansible.builtin.template:
    src: supervisor.conf.j2
    dest: /etc/supervisor/conf.d/application.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart application

- name: Apply changed application files
  ansible.builtin.meta: flush_handlers

- name: Read application status
  ansible.builtin.command: supervisorctl status application
  register: application_status
  changed_when: false
  failed_when: false

- name: Start stopped application
  ansible.builtin.command: supervisorctl start application
  when: "'RUNNING' not in application_status.stdout"
  changed_when: true

- name: Wait for healthy application and database
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}/health"
    status_code: 200
    return_content: true
  register: application_health
  until: application_health.status == 200
  retries: 20
  delay: 2

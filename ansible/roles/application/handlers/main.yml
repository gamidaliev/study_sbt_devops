---
- name: Reread application process configuration
  ansible.builtin.command: supervisorctl reread
  changed_when: true
  listen: Restart application

- name: Update application process configuration
  ansible.builtin.command: supervisorctl update
  changed_when: true
  listen: Restart application

- name: Restart application process
  ansible.builtin.command: supervisorctl restart application
  changed_when: true
  listen: Restart application

---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    policy_rc_d: 101

- name: Configure and validate nginx
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: '0644'
    validate: /usr/sbin/nginx -t -c %s
  notify: Restart nginx

- name: Configure nginx process
  ansible.builtin.template:
    src: supervisor.conf.j2
    dest: /etc/supervisor/conf.d/nginx.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart nginx

- name: Apply changed nginx configuration
  ansible.builtin.meta: flush_handlers

- name: Read nginx status
  ansible.builtin.command: supervisorctl status nginx
  register: nginx_status
  changed_when: false
  failed_when: false

- name: Start stopped nginx
  ansible.builtin.command: supervisorctl start nginx
  when: "'RUNNING' not in nginx_status.stdout"
  changed_when: true
